<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">

  <!-- Public CesiumJS CDN: suitable for GitHub Pages -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.89/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.89/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <title>EO4DES WebGIS Demo</title>

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
    }

    .top-banner {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 10px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 8px 26px rgba(0,0,0,0.24);
      backdrop-filter: blur(8px);
    }

    .top-banner img.eu-logo {
      height: 58px;
      max-width: 46%;
      object-fit: contain;
    }

    .top-banner img.project-logo {
      height: 76px;
      max-width: 170px;
      object-fit: contain;
    }

    .top-banner-title {
      flex: 1;
      text-align: center;
      color: #263238;
      line-height: 1.25;
    }

    .top-banner-title strong {
      display: block;
      font-size: 1.25rem;
      letter-spacing: .04em;
      color: #2f7d32;
    }

    .top-banner-title span {
      font-size: .9rem;
      color: #455a64;
    }

    .layer-panel {
      position: absolute;
      top: 125px;
      left: 18px;
      z-index: 11;
      width: 335px;
      padding: 18px;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(145deg, rgba(19,35,42,.92), rgba(34,75,62,.88));
      box-shadow: 0 10px 30px rgba(0,0,0,.32);
      backdrop-filter: blur(8px);
    }

    .layer-panel h3 {
      margin: 0 0 12px 0;
      color: #fff;
      font-size: 1.05rem;
      letter-spacing: .03em;
    }

    .layer-panel label {
      display: block;
      margin-bottom: 8px;
      font-size: .82rem;
      color: rgba(255,255,255,.82);
    }

    .layer-panel select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 10px;
      background: rgba(255,255,255,.96);
      color: #263238;
      font-size: .92rem;
      outline: none;
    }


    .area-buttons,.step-buttons {display:flex;gap:6px;margin:0 0 12px}
    .area-buttons button,.step-buttons button {flex:1;cursor:pointer;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:9px 5px;background:rgba(255,255,255,.15);color:white;font-size:.79rem}
    .area-buttons button:hover,.step-buttons button:hover {background:rgba(255,255,255,.28)}
    .temporal-controls {margin-top:12px}
    .temporal-controls[hidden] {display:none}
    .date-controls {display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
    .step-buttons {margin-top:12px}
    .layer-panel .toggle-layer {margin-top:12px;display:flex;align-items:center;gap:8px}
    .toggle-layer input {accent-color:#8bc34a}

    .layer-note,
    .status-note {
      margin: 12px 0 0 0;
      font-size: .78rem;
      color: rgba(255,255,255,.72);
      line-height: 1.35;
    }

    .status-note {
      display: none;
      padding: 8px 10px;
      border-radius: 9px;
      background: rgba(255,255,255,.10);
    }

    .legend-panel {
      position: absolute;
      left: 18px;
      bottom: 28px;
      z-index: 11;
      display: none;
      min-width: 250px;
      max-width: 340px;
      padding: 15px;
      border-radius: 16px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 10px 30px rgba(0,0,0,.30);
      backdrop-filter: blur(8px);
      color: #263238;
    }

    .legend-panel h4 {
      margin: 0 0 10px 0;
      font-size: .95rem;
      color: #263238;
    }

    .legend-gradient {
      height: 18px;
      border-radius: 9px;
      margin-bottom: 7px;
      border: 1px solid rgba(0,0,0,.12);
    }

    .legend-scale {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: .72rem;
      color: #546e7a;
    }

    .legend-description {
      margin-top: 8px;
      font-size: .78rem;
      color: #546e7a;
      line-height: 1.35;
    }

    .cesium-viewer-toolbar,
    .cesium-viewer-animationContainer,
    .cesium-viewer-timelineContainer,
    .cesium-viewer-bottom,
    .cesium-viewer-fullscreenContainer {
      display: none !important;
    }

    .cesium-infoBox {
      top: 120px !important;
      right: 18px !important;
      max-height: calc(100vh - 145px) !important;
      z-index: 12 !important;
      border-radius: 14px !important;
      overflow: hidden !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.28) !important;
    }

    .cesium-infoBox-title {
      padding: 10px 38px 10px 14px !important;
    }

    @media (max-width: 760px) {
      .top-banner {
        left: 8px;
        right: 8px;
        top: 8px;
        padding: 8px 10px;
        gap: 8px;
      }

      .top-banner img.eu-logo {
        height: 42px;
        max-width: 44%;
      }

      .top-banner img.project-logo {
        height: 52px;
        max-width: 90px;
      }

      .top-banner-title strong {
        font-size: .95rem;
      }

      .top-banner-title span {
        font-size: .72rem;
      }

      .layer-panel {
        top: 92px;
        left: 8px;
        right: 8px;
        width: auto;
        padding: 13px;
      }

      .legend-panel {
        left: 8px;
        right: 8px;
        bottom: 12px;
        max-width: none;
      }

      .cesium-infoBox {
        top: 88px !important;
        right: 8px !important;
        left: 8px !important;
        width: auto !important;
        max-height: calc(100vh - 105px) !important;

    }
  </style>
</head>

<div id="cesiumContainer"></div>

<header class="top-banner">
  <img class="eu-logo" src="../images/europa.png" alt="European Union - NextGenerationEU">
  <div class="top-banner-title">
    <strong>EO4DES WebGIS Demo</strong>
    <span>Earth Observation for Desertification</span>
  </div>
  <a href="../index.html" title="EO4DES homepage" aria-label="Back to EO4DES homepage"><img class="project-logo" src="../images/logo.png" alt="EO4DES logo"></a>
</header>

<section class="layer-panel">
  <h3>WebGIS Layers</h3>
  <label>Study areas</label>
  <div class="area-buttons">
    <button type="button" id="goOverview">Overview</button>
    <button type="button" id="goSicily">Catania - Sicily</button>
    <button type="button" id="goLecce">Lecce - Puglia</button>
  </div>
  <label for="areaSelect">Study area</label>
  <select id="areaSelect">
    <option value="sicily">Catania - Sicily</option>
    <option value="lecce">Lecce - Puglia</option>
  </select>
  <div id="sicilyControls" class="temporal-controls">
    <label for="productSelect">Satellite index</label>
    <select id="productSelect"><option value="NDVI">NDVI</option><option value="Albedo">Albedo</option></select>
    <div class="date-controls">
      <div><label for="yearSelect">Year</label><select id="yearSelect"></select></div>
      <div><label for="monthSelect">Month</label><select id="monthSelect">
        <option value="08">August</option><option value="09">September</option><option value="10">October</option>
      </select></div>
    </div>
    <div class="step-buttons"><button type="button" id="prevDate">&#8592; Previous</button><button type="button" id="nextDate">Next &#8594;</button></div>
  </div>
  <div id="lecceControls" class="temporal-controls" hidden>
    <label for="lecceSelect">Thematic layer</label>
    <select id="lecceSelect">
      <option value="Thermalanomaly_Lecce_14082024">Thermal anomaly — 14/08/2024</option>
      <option value="StatistichezonaliDT_Lecce_14082024">Zonal statistics DT — 14/08/2024</option>
      <option value="Land_Surface_Temperature_Lecce_14082025">Land Surface Temperature — 14/08/2025</option>
    </select>
  </div>
  <label class="toggle-layer"><input type="checkbox" id="showLayer" checked> Show thematic layer</label>
  <p class="layer-note">
    Static GitHub Pages demo: no GeoServer/PostGIS connection is required.
  </p>
  <div id="statusNote" class="status-note"></div>
</section>

<section id="legendPanel" class="legend-panel">
  <h4 id="legendTitle">Legend</h4>
  <div id="legendGradient" class="legend-gradient"></div>
  <div id="legendScale" class="legend-scale">
    <span id="legendMin"></span>
    <span id="legendMax"></span>
  </div>
  <div id="legendDescription" class="legend-description"></div>
</section>

<script>

    EO4DES GitHub Demo
    ------------------
    Expected static files:

    data/regioni.geojson
    data/statistiche_zonali_lecce.geojson
    data/thermal_anomaly_lecce_14082024.png
    data/lst_lecce_14082025.png

    IMPORTANT:
    Update DEMO_EXTENT below with the exact geographic extent
    of your exported raster images (west, south, east, north, EPSG:4326).
  */

  const DEMO_EXTENT = {
    west: 18.032132580655,
    south: 40.307150786973,
    east: 18.313748210356,
    north: 40.507855658669
  };

  // Add your own Cesium ion token to enable Cesium World Terrain.
  // Leave the string empty to keep the ellipsoid fallback.
  const CESIUM_ION_TOKEN = "";
  if (CESIUM_ION_TOKEN.trim()) {
    Cesium.Ion.defaultAccessToken = CESIUM_ION_TOKEN.trim();
  }

  const satelliteProvider = new Cesium.ArcGisMapServerImageryProvider({
    url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
  });

  const viewer = new Cesium.Viewer("cesiumContainer", {
    terrainProvider: CESIUM_ION_TOKEN.trim()
      ? Cesium.createWorldTerrain()
      : new Cesium.EllipsoidTerrainProvider(),
    imageryProvider: satelliteProvider,
    animation: false,
    timeline: false,
    baseLayerPicker: false,
    geocoder: false,
    homeButton: false,
    sceneModePicker: false,
    navigationHelpButton: false,
    fullscreenButton: false,
    vrButton: false,
    selectionIndicator: false,
    infoBox: true
  });

  const SICILY_EXTENT = {west:14.591344859,south:37.238258641,east:14.866149316,north:37.462253642};
  const OVERVIEW_EXTENT = {west:14.25,south:36.85,east:18.65,north:40.85};
  function rectangleOf(bounds) {return Cesium.Rectangle.fromDegrees(bounds.west,bounds.south,bounds.east,bounds.north);}
  viewer.camera.setView({
    destination: rectangleOf(OVERVIEW_EXTENT),
    orientation: {
      heading: Cesium.Math.toRadians(0.0),
      pitch: Cesium.Math.toRadians(-70.0),
      roll: 0.0
    }
  });

  const layers = viewer.scene.imageryLayers;

  // Place labels over satellite imagery. They are intentionally added before
  // thematic layers so the EO raster remains the primary visualization.
  const placeLabels = layers.addImageryProvider(
    new Cesium.ArcGisMapServerImageryProvider({
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer"
    })
  );
  placeLabels.alpha = 1.0;
  viewer.scene.globe.depthTestAgainstTerrain = false;

  let currentRasterLayer = null;
  let zonalDataSource = null;
  let regioniDataSource = null;
  let selectedEntity = null;
  let previousMaterial = null;
  let previousOutlineColor = null;

  const statusNote = document.getElementById("statusNote");

  function showStatus(message) {
    statusNote.textContent = message;
    statusNote.style.display = message ? "block" : "none";
  }

  function hideCurrentThematicLayer() {
    if (currentRasterLayer) {
      layers.remove(currentRasterLayer, true);
      currentRasterLayer = null;
    }

    if (zonalDataSource) {
      zonalDataSource.show = false;
    }

    clearSelection();
  }

  function clearSelection() {
    if (selectedEntity && selectedEntity.polygon) {
      if (previousMaterial) {
        selectedEntity.polygon.material = previousMaterial;
      }
      if (previousOutlineColor) {
        selectedEntity.polygon.outlineColor = previousOutlineColor;
      }
    }

    selectedEntity = null;
    previousMaterial = null;
    previousOutlineColor = null;
    viewer.selectedEntity = undefined;
  }

  function propertyValue(entity, key) {
    if (!entity || !entity.properties || !entity.properties[key]) return null;
    try {
      return entity.properties[key].getValue(Cesium.JulianDate.now());
    } catch (e) {
      return entity.properties[key];
    }
  }

  function propertyRows(entity) {
    if (!entity.properties) {
      return "<p>No attributes available.</p>";
    }

    const names = entity.properties.propertyNames || [];
    let rows = "";

    names.forEach(function(name) {
      const value = propertyValue(entity, name);
      if (value !== null && value !== undefined && value !== "") {
        rows +=
          "<tr>" +
          "<td style='padding:6px 10px;border-bottom:1px solid #ddd;font-weight:600;'>" +
          name +
          "</td>" +
          "<td style='padding:6px 10px;border-bottom:1px solid #ddd;'>" +
          value +
          "</td>" +
          "</tr>";
      }
    });

    return (
      "<div style='font-family:Arial,sans-serif;padding:8px;'>" +
      "<table style='border-collapse:collapse;width:100%;font-size:13px;'>" +
      rows +
      "</table></div>"
    );
  }

  async function loadRegions() {
    try {
      regioniDataSource = await Cesium.GeoJsonDataSource.load(
        "data/regioni.geojson",
        {
          clampToGround: true,
          stroke: Cesium.Color.fromCssColorString("#d97706"),
          fill: Cesium.Color.TRANSPARENT,
          strokeWidth: 2
        }
      );

      viewer.dataSources.add(regioniDataSource);

      regioniDataSource.entities.values.forEach(function(entity) {
        if (entity.polygon) {
          entity.polygon.material = Cesium.Color.TRANSPARENT;
          entity.polygon.outline = true;
          entity.polygon.outlineColor = Cesium.Color.fromCssColorString("#d97706");
        }
      });
    } catch (error) {
      console.warn("Optional regions GeoJSON not loaded:", error);
    }
  }

  async function loadZonalStatistics() {
    if (zonalDataSource) {
      zonalDataSource.show = true;
      return;
    }

    try {
      zonalDataSource = await Cesium.GeoJsonDataSource.load(
        "data/statistiche_zonali_lecce.geojson",
        {
          clampToGround: true,
          stroke: Cesium.Color.fromCssColorString("#666666"),
          fill: Cesium.Color.fromCssColorString("#9e9e9e").withAlpha(0.58),
          strokeWidth: 1.5
        }
      );

      viewer.dataSources.add(zonalDataSource);

      zonalDataSource.entities.values.forEach(function(entity) {
        entity.name =
          "Zonal statistics" +
          (propertyValue(entity, "fid") !== null
            ? " - fid " + propertyValue(entity, "fid")
            : "");

        entity.description = new Cesium.ConstantProperty(
          propertyRows(entity)
        );

        if (entity.polygon) {
          entity.polygon.material =
            Cesium.Color.fromCssColorString("#9e9e9e").withAlpha(0.58);
          entity.polygon.outline = true;
          entity.polygon.outlineColor =
            Cesium.Color.fromCssColorString("#666666");
        }
      });

      zonalDataSource.show = true;
    } catch (error) {
      console.error(error);
      showStatus(
        "Missing data/statistiche_zonali_lecce.geojson. Export the GeoServer shapefile as GeoJSON and add it to the data folder."
      );
    }
  }

    currentRasterLayer = layers.addImageryProvider(

        url: urlTemplate,
        tilingScheme: new Cesium.WebMercatorTilingScheme(),
        minimumLevel: 9,
        maximumLevel: 13
      })
    );
    currentRasterLayer.alpha = 1.0;
  }

  function updateLegend(selectedLayer) {
    const legendPanel = document.getElementById("legendPanel");
    const legendTitle = document.getElementById("legendTitle");
    const legendGradient = document.getElementById("legendGradient");
    const legendMin = document.getElementById("legendMin");
    const legendMax = document.getElementById("legendMax");
    const legendDescription = document.getElementById("legendDescription");

    const meta = layerMetadata[selectedLayer];

    if (!meta || !meta.gradient) {
      legendPanel.style.display = "none";
      return;
    }

    legendTitle.textContent = meta.title;
    legendGradient.style.background = meta.gradient;
    legendMin.textContent = meta.min;
    legendMax.textContent = meta.max;
    legendDescription.textContent = meta.description || "";
    legendPanel.style.display = "block";
  }

  // AOI markers remain visible on the satellite basemap; click to navigate.
  function addStudyMarker(name, longitude, latitude, target) {
    const entity = viewer.entities.add({
      name: name,
      position: Cesium.Cartesian3.fromDegrees(longitude, latitude),
      point: {pixelSize: 11,color: Cesium.Color.LIME,outlineColor: Cesium.Color.BLACK,outlineWidth: 2,
        disableDepthTestDistance: Number.POSITIVE_INFINITY},
      label: {text:name,font:"bold 15px sans-serif",fillColor:Cesium.Color.WHITE,
        outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset:new Cesium.Cartesian2(0,-24),verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
        disableDepthTestDistance:Number.POSITIVE_INFINITY}
    });
    entity.studyTarget = target;
  }
  addStudyMarker("Catania - Sicily",(SICILY_EXTENT.west+SICILY_EXTENT.east)/2,(SICILY_EXTENT.south+SICILY_EXTENT.north)/2,"sicily");
  addStudyMarker("Lecce - Puglia",(DEMO_EXTENT.west+DEMO_EXTENT.east)/2,(DEMO_EXTENT.south+DEMO_EXTENT.north)/2,"lecce");

  const areaSelect = document.getElementById("areaSelect");
  const productSelect = document.getElementById("productSelect");
  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");
  const lecceSelect = document.getElementById("lecceSelect");
  const showLayer = document.getElementById("showLayer");
  for (let year=2017;year<=2024;year++) {
    const option=document.createElement("option");option.value=String(year);option.textContent=String(year);
    yearSelect.appendChild(option);
  }
  yearSelect.value="2024";
  monthSelect.value="10";

  function flyToArea(area) {
    const bounds = area === "sicily" ? SICILY_EXTENT : area === "lecce" ? DEMO_EXTENT : OVERVIEW_EXTENT;
    viewer.camera.flyTo({destination:rectangleOf(bounds),duration:1.5});
  }
  async function refreshThematicLayer() {
    hideCurrentThematicLayer();
    showStatus("");
    const area=areaSelect.value;
    const key=area==="sicily"
      ? `Sicily_${productSelect.value}_${yearSelect.value}_${monthSelect.value}`
      : lecceSelect.value;
    updateLegend(showLayer.checked ? key : "none");
    if (!showLayer.checked) return;
    if (area==="sicily") {
      addXYZRaster(`data/sicily/${productSelect.value.toLowerCase()}/${yearSelect.value}_${monthSelect.value}/{z}/{x}/{y}.png`);
      layers.raiseToTop(placeLabels);
    } else if (key==="Thermalanomaly_Lecce_14082024") {
      addXYZRaster("data/thermal_anomaly/{z}/{x}/{y}.png");layers.raiseToTop(placeLabels);
    } else if (key==="Land_Surface_Temperature_Lecce_14082025") {
      addXYZRaster("data/lst/{z}/{x}/{y}.png");layers.raiseToTop(placeLabels);
    } else if (key==="StatistichezonaliDT_Lecce_14082024") {
      await loadZonalStatistics();
    }
  }
  function chooseArea(area,moveCamera=true) {
    areaSelect.value=area;
    document.getElementById("sicilyControls").hidden=area!=="sicily";
    document.getElementById("lecceControls").hidden=area!=="lecce";
    if(moveCamera)flyToArea(area);
    refreshThematicLayer();
  }
  function stepDate(delta) {
    const index=(Number(yearSelect.value)-2017)*3+["08","09","10"].indexOf(monthSelect.value);
    const next=Math.max(0,Math.min(23,index+delta));
    yearSelect.value=String(2017+Math.floor(next/3));
    monthSelect.value=["08","09","10"][next%3];
    refreshThematicLayer();
  }
  document.getElementById("goOverview").addEventListener("click",()=>flyToArea("overview"));
  document.getElementById("goSicily").addEventListener("click",()=>chooseArea("sicily"));
  document.getElementById("goLecce").addEventListener("click",()=>chooseArea("lecce"));
  document.getElementById("prevDate").addEventListener("click",()=>stepDate(-1));
  document.getElementById("nextDate").addEventListener("click",()=>stepDate(1));
  areaSelect.addEventListener("change",()=>chooseArea(areaSelect.value));
  [productSelect,yearSelect,monthSelect,lecceSelect,showLayer].forEach(el=>el.addEventListener("change",refreshThematicLayer));
  chooseArea("sicily",false);

  const clickHandler = new Cesium.ScreenSpaceEventHandler(
    viewer.scene.canvas
  );

  clickHandler.setInputAction(
    function(click) {
      const picked = viewer.scene.pick(click.position);
      if (Cesium.defined(picked) && picked.id && picked.id.studyTarget) {
        chooseArea(picked.id.studyTarget);
        return;
      }
      if (!zonalDataSource || !zonalDataSource.show) {
        return;
      }


      if (!Cesium.defined(picked) || !picked.id) {
        clearSelection();
        return;
      }

      const entity = picked.id;

      if (!zonalDataSource.entities.contains(entity) || !entity.polygon) {
        return;
      }

      clearSelection();

      selectedEntity = entity;
      previousMaterial = entity.polygon.material;
      previousOutlineColor = entity.polygon.outlineColor;

      entity.polygon.material =
        Cesium.Color.fromCssColorString("#ff8c00").withAlpha(0.75);
      entity.polygon.outline = true;
      entity.polygon.outlineColor =
        Cesium.Color.fromCssColorString("#ff5a00");

      viewer.selectedEntity = entity;
    },
    Cesium.ScreenSpaceEventType.LEFT_CLICK
  );

  loadRegions();
